<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reforço Escolar - Hora de Aprender</title>
    <style>
        :root {
            --primary-color: #f59e0b;
            --primary-hover: #d97706;
            --accent-color: #3b82f6;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1f2937;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('fundo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            padding: 20px;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
            width: 100%;
            max-width: 420px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto 12px auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-header {
            margin-bottom: 24px;
        }

        .login-header h1 {
            font-size: 24px;
            color: #d97706;
            font-weight: 700;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .login-header p {
            font-size: 13px;
            color: #4b5563;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #ffffff;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .error-message {
            background-color: #fee2e2;
            color: var(--error-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid #fca5a5;
        }

        .footer-links {
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
        }

        .footer-links a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="logo.png" alt="Logo Hora de Aprender" class="login-logo">

        <div class="login-header">
            <h1>Hora de Aprender</h1>
            <p>Acesse sua conta para visualizar e enviar trabalhos</p>
        </div>

        <div id="errorAlert" class="error-message">E-mail ou senha inválidos.</div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="btnEntrar">Entrar</button>
        </form>

			<div class="footer-links">
					<a href="sobre.html">&larr; Voltar ao Início</a>
					<a href="#">Esqueceu a senha?</a>
			</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const errorAlert = document.getElementById('errorAlert');
            const btnEntrar = document.getElementById('btnEntrar');

            errorAlert.style.display = 'none';
            btnEntrar.textContent = 'Entrando...';
            btnEntrar.disabled = true;

            setTimeout(() => {
                if(email === "aluno@teste.com" && senha === "123456") {
                    alert("Login simulado com sucesso!");
                } else {
                    errorAlert.textContent = "Credenciais incorretas (Tente aluno@teste.com / 123456)";
                    errorAlert.style.display = 'block';
                }
                btnEntrar.textContent = 'Entrar';
                btnEntrar.disabled = false;
            }, 1000);
        });
    </script>

</body>
</html>
